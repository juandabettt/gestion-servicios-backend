spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 3
          max-idle: 2
          min-idle: 1
  flyway:
    enabled: true
    baseline-on-migrate: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 20
      min-spare: 4
    max-connections: 100

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS}

encryption:
  field-key: ${FIELD_ENCRYPTION_KEY}

payment:
  gateway:
    url: ${PAYMENT_GATEWAY_URL}
    api-key: ${PAYMENT_GATEWAY_API_KEY}
    webhook-secret: ${PAYMENT_GATEWAY_WEBHOOK_SECRET}

storage:
  endpoint: ${STORAGE_ENDPOINT}
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}
  bucket-name: ${STORAGE_BUCKET_NAME}
  region: ${STORAGE_REGION}

ai:
  service:
    api-key: ${AI_SERVICE_API_KEY}
    model: ${AI_SERVICE_MODEL}

app:
  env: ${APP_ENV}
  instance-id: ${APP_INSTANCE_ID}

resilience4j:
  circuitbreaker:
    instances:
      ocrService:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      paymentGateway:
        sliding-window-size: 5
        failure-rate-threshold: 30
        wait-duration-in-open-state: 60s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.tuapp.servicios: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    org.flywaydb: INFO
